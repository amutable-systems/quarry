# The quarry-client configuration file is <prefix>/quarry-client/config.toml,
# looked up in the UAPI.6 prefixes /usr/lib, /usr/local/lib, /run and /etc in
# that order of increasing priority. Only the copy in the highest-priority
# prefix that has one is read.
#
# Drop-ins in <prefix>/quarry-client/config.toml.d/*.toml are then applied on
# top of it in file name order, regardless of the prefix they come from,
# replacing only the settings they specify. Each drop-in has to declare its own
# config_version. An empty meta_root_url or data_root_url resets it to the
# value derived from the repository name.

config_version = 1
cache_dir = "/var/lib/quarry-client/latest-metadata"
# Official AmutableOS update repository (nightly stream).
[repo."updates.example.com/base-os/nightly"]
# Use the bundled root.json in the base OS image as the root of trust.
#  %eR expands to the repository name, passed through "systemd-escape --path".
root_trust = { type = "bundled", path = "/usr/share/amutable/quarry/trusted/%eR-root.json" }
meta_root_url = "https://updates.example.com/update"
data_root_url = "https://updates.example.com/update"

# Per-machine repository.
#  %m expands to the per-machine repo (blinded by the Amutable app-specific
#     UUID a-la "systemd-i128 machine-id -a ...").
[repo."userdata.example.com/tenant/machine-id/%m"]
root_trust = "insecure-tofu" # TODO: Make this use the TPM-encrypted trust model.
meta_root_url = "https://userdata.example.com/tenant/machine-id/%m"
#data_root_url = "https://userdata.example.com/tenant/machine-id/%m/targets"
